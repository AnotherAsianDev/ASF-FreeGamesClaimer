name: build

on:
  push:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Publish plugin
        run: dotnet publish FreeGamesClaimer -c Release -o out

      - name: Keep only the plugin dll
        run: |
          mkdir dist
          cp out/FreeGamesClaimer.dll dist/

      - uses: actions/upload-artifact@v4
        with:
          name: FreeGamesClaimer
          path: dist/FreeGamesClaimer.dll
